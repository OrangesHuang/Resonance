[mypy]
python_version = 3.9
# 第三方库无类型 stubs(akshare/requests), 按模块忽略
[mypy-akshare.*]
ignore_missing_imports = True

[mypy-requests]
ignore_missing_imports = True

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True
